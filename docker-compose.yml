name: Kavero

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      secrets:
        - web_env
    init: true
    ports:
      - "3001:3001"
    env_file:
      - path: apps/web/.env
        required: false
    environment:
      BETTER_AUTH_URL: http://localhost:3001
      CORS_ORIGIN: http://localhost:3001
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/Kavero
      KAVERO_STORAGE_DIR: /data/storage
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Exports render through the app itself; use its address inside the container.
      KAVERO_RENDER_URL: http://127.0.0.1:3001
    volumes:
      - Kavero_storage_data:/data/storage
    # Chromium needs more shared memory than Docker's 64 MB default for PDF/video export.
    shm_size: 1gb
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # One-shot: applies packages/db/src/migrations, then exits. Reuses the web image's builder stage
  # (full workspace + drizzle-kit). Run on its own with: docker compose run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: builder
      secrets:
        - web_env
    working_dir: /app/packages/db
    command: ["bunx", "drizzle-kit", "migrate"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/Kavero
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:18
    container_name: Kavero-postgres
    environment:
      POSTGRES_DB: Kavero
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5436:5432"
    volumes:
      - Kavero_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - Kavero_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  Kavero_postgres_data:
  Kavero_storage_data:
  Kavero_redis_data:

# BuildKit makes these available only while install/build commands run.
secrets:
  web_env:
    file: apps/web/.env
