name: Release (Windows)

# Every push to master that contains a feature or fix becomes a release:
#   1. scripts/release.ts picks the next version from the commits since the last tag
#      (feat → minor, fix/perf → patch, breaking → major) and updates CHANGELOG.md
#      and the app versions; that commit is pushed with a vX.Y.Z tag.
#   2. The Windows installer is built from the tag.
#   3. A GitHub release is published with the changelog section and the installer.
# Docs/chore/ci-only pushes don't release. Run it by hand to force a bump or a prerelease.

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "skills/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      prerelease:
        description: Prerelease label (e.g. beta → 1.4.0-beta.1). Leave empty for a normal release.
        type: string
        default: ""

# One release at a time, never cancelled half-way (a tag may already be pushed).
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  # Build-time placeholders only: the desktop app supplies the real env at runtime
  # (see docs/desktop.md). Never put real secrets here.
  DATABASE_URL: postgres://kavero:kavero@127.0.0.1:5432/kavero_build
  BETTER_AUTH_SECRET: build-only-not-a-secret-0123456789abcdefghijklmn
  BETTER_AUTH_URL: http://127.0.0.1:41731

jobs:
  version:
    name: Version and changelog
    # Skip the release commit this workflow pushes itself.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release)') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A token that may push to master. With branch protection, add a RELEASE_TOKEN
          # secret (fine-grained PAT with contents: write); otherwise GITHUB_TOKEN is used.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Never tag a commit that doesn't pass the same checks as CI.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Type check and unit tests
        run: |
          bun run check-types
          bun run test

      - name: Work out the next version
        id: plan
        run: |
          args=(--write)
          [ "${{ inputs.bump }}" != "" ] && args+=(--bump "${{ inputs.bump }}")
          [ "${{ inputs.prerelease }}" != "" ] && args+=(--pre "${{ inputs.prerelease }}")
          bun scripts/release.ts "${args[@]}"

      - name: Commit, tag and push
        if: steps.plan.outputs.release == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md apps/desktop/package.json apps/web/package.json
          git commit -m "chore(release): $TAG [skip ci]"
          git tag -a "$TAG" -m "Kavero $TAG"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "$TAG"

      - name: Keep the release notes for the publish job
        if: steps.plan.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

      - name: Summary
        run: |
          if [ "${{ steps.plan.outputs.release }}" = "true" ]; then
            echo "### Releasing ${{ steps.plan.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
            cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release: nothing but docs/chore/ci changes since the last tag." >> "$GITHUB_STEP_SUMMARY"
          fi

  windows:
    name: Build Windows installer
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # electron's binary download and electron-builder's helper scripts run on Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('apps/desktop/package.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build web (standalone)
        run: bun run --filter web build
        env:
          NODE_ENV: production

      - name: Build installer
        shell: bash
        working-directory: apps/desktop
        env:
          # Code signing (optional). Without a certificate the installer is unsigned and
          # Windows SmartScreen shows "unknown publisher" on first run.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        # scripts/dist.mjs builds for the runner's OS, drops empty secrets and writes
        # latest.yml (auto-update metadata) for GITHUB_REPOSITORY. It never uploads anything.
        run: |
          bun run build
          node scripts/prepare-web.mjs
          node scripts/dist.mjs

      - name: Check the installer version
        shell: bash
        run: |
          ls apps/desktop/release
          ls apps/desktop/release/*-${{ needs.version.outputs.version }}-*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: kavero-windows
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml

  publish:
    name: Publish GitHub release
    needs: [version, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kavero-windows
          path: installers

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Kavero ${{ needs.version.outputs.tag }}
          body_path: release-notes.md
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.version.outputs.prerelease != 'true' }}
          fail_on_unmatched_files: true
          files: installers/*
