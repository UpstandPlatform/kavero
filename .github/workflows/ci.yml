name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  # Placeholders: varlock validates apps/web/.env.schema during install (codegen) and
  # `next build`. Nothing connects to them.
  DATABASE_URL: postgres://kavero:kavero@127.0.0.1:5432/kavero_ci
  BETTER_AUTH_SECRET: ci-only-not-a-secret-0123456789abcdefghijklmnop
  BETTER_AUTH_URL: http://localhost:3001

jobs:
  check:
    name: Types, tests, web build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Cache Turborepo and Next build cache
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            apps/web/.next/cache
          key: build-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run check-types

      - name: Unit tests
        run: bun run test

      - name: Build web
        run: bun run --filter web build
        env:
          NODE_ENV: production
