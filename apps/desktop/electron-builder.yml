# electron-builder config for the Kavero desktop app.
# Build the web app first (bun run --filter web build); `bun run dist` stages it via
# scripts/prepare-web.mjs into web-bundle/, which ships as <resources>/web.
appId: app.kavero.desktop
productName: Kavero
copyright: Copyright © 2026 Kavero

directories:
  output: release
  # icon.png / icon.ico and the installer artwork come from scripts/make-icons.ts (assets/icon.svg).
  buildResources: assets

asar: true
# The main process has no runtime dependencies; nothing to rebuild for Electron.
npmRebuild: false
files:
  - dist/**/*.js
  - package.json
  # Window icon on Linux (Windows and macOS use the executable's icon).
  - assets/icon.png
  - "!**/*.map"
  - "!node_modules/**/*"

extraResources:
  - from: web-bundle
    to: web
    filter:
      - "**/*"
  # electron-builder skips a top-level node_modules inside `from`; copy it explicitly.
  - from: web-bundle/node_modules
    to: web/node_modules
    filter:
      - "**/*"

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# kavero://editor/<id> links from MCP agents open in the app (Windows registers at runtime too).
protocols:
  - name: Kavero
    schemes: [kavero]

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  # Branded installer: icon, welcome/finish sidebar and inner-page header in the app's style.
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerSidebar: assets/installerSidebar.bmp
  uninstallerSidebar: assets/uninstallerSidebar.bmp
  installerHeader: assets/installerHeader.bmp
  shortcutName: Kavero
  createDesktopShortcut: true
  createStartMenuShortcut: true
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

mac:
  icon: assets/icon.png
  category: public.app-category.productivity
  # arm64 only: the bundled server carries native modules (sharp, ffmpeg) for the build
  # machine's arch. Add x64 by building on an Intel runner (macos-13) as a separate job.
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  hardenedRuntime: true
  # Notarization runs when APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID are set.
  notarize: false

linux:
  icon: assets/icon.png
  category: Office
  maintainer: Kavero <hello@kavero.app>
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

# Publishing (GitHub Releases) is configured by scripts/dist.mjs from GITHUB_REPOSITORY,
# so local builds work without a git remote. Releases are uploaded by .github/workflows/desktop.yml.
